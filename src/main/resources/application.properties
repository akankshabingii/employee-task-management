spring.application.name=employee-task-management

spring.datasource.url=jdbc:mysql://localhost:3306/employee_task_management
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}

# Secret code required to sign up as ADMIN (leave unset to disable admin signup)
app.admin-signup-code=${ADMIN_SIGNUP_CODE:}